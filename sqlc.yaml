version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlite"
        out: "internal/store/sqlite"
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "devices.id"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceID"
          - column: "devices.source"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.Source"
          - column: "devices.type"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceType"
          - column: "zigbee_devices.device_id"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceID"
          - column: "zigbee_device_metadata.device_id"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceID"
          - column: "device_state_samples.device_id"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceID"
          - column: "group_members.member_type"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.GroupMemberType"
          - column: "group_tags.tag"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.GroupTag"
          - column: "room_members.member_type"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.RoomMemberType"
          - column: "scene_targets.target_type"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.TargetType"
          - column: "scene_device_behaviors.device_id"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceID"
          - column: "active_scene_members.device_id"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.DeviceID"
          - column: "floorplan_placements.member_type"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.TargetType"
          - column: "network_topology_snapshots.provider"
            go_type: "github.com/saffronjam/saffron-hive/internal/device.Source"
