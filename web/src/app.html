<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link id="app-manifest" rel="manifest" href="/manifest.en.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Hive</title>
    <style>
      /* Paints the canvas before the stylesheet loads, then follows the theme
         token once the stylesheet is available. */
      html {
        color-scheme: dark;
        background-color: var(--background, #09090b);
      }
      html:not(.dark) {
        color-scheme: light;
        background-color: #ffffff;
      }
    </style>
    <script>
      (function () {
        var supportedLanguages = ["en", "sv", "ru"];
        var storedLanguage = localStorage.getItem("saffron-hive-language");
        var preferredLanguages = storedLanguage
          ? [storedLanguage]
          : navigator.languages || [navigator.language];
        var language = "en";
        for (var i = 0; i < preferredLanguages.length; i += 1) {
          var candidate = String(preferredLanguages[i]).trim().toLowerCase().split(/[-_]/, 1)[0];
          if (supportedLanguages.indexOf(candidate) !== -1) {
            language = candidate;
            break;
          }
        }
        document.documentElement.lang = language;
        var manifest = document.getElementById("app-manifest");
        if (manifest) manifest.setAttribute("href", "/manifest." + language + ".webmanifest");

        var theme = localStorage.getItem("saffron-hive-theme");
        var dark = true;
        if (theme === "light") {
          dark = false;
        } else if (!theme && !window.matchMedia("(prefers-color-scheme: dark)").matches) {
          dark = false;
        }
        if (!dark) {
          document.documentElement.classList.remove("dark");
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", dark ? "#09090b" : "#ffffff");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
