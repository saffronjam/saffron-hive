  AutomationTriggerInput:
    model: github.com/saffronjam/saffron-hive/internal/automation.AuthoringTrigger
    fields:
      mode:
        omittable: false
      deviceId:
        omittable: false
      property:
        omittable: false
      comparator:
        omittable: false
      value:
        omittable: false
      eventValue:
        omittable: false
      eventType:
        omittable: false
      customExpr:
        omittable: false
      endpointId:
        omittable: false
      scheduleSubmode:
        omittable: false
      cronExpr:
        omittable: false
      scheduleHour:
        omittable: false
      scheduleMinute:
        omittable: false
      scheduleSecond:
        omittable: false
      scheduleIntervalValue:
        omittable: false
      scheduleIntervalUnit:
        omittable: false
      graceMs:
        omittable: false
      cooldownMs:
        omittable: false
      holdMs:
        omittable: false
      webhookFilters:
        omittable: false
      scheduleWeekdays:
        omittable: false
  AutomationWebhookFilter:
