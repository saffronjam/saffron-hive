schema:
  - api/schema.graphql
  - api/assistant.graphql
  - api/authoring.graphql

exec:
  filename: internal/graph/generated.go
  package: graph

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind: []

nullable_input_omittable: true

models:
  Device:
    fields:
      zigbee2Mqtt:
        resolver: true
  Zigbee2MqttDeviceMetadata:
    fields:
      documentation:
        resolver: true
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time

  AutomationLiteral:
    model: github.com/saffronjam/saffron-hive/internal/automation.Literal
  AutomationLiteralInput:
    model: github.com/saffronjam/saffron-hive/internal/automation.Literal
    fields:
      stringValue:
        omittable: false
      numberValue:
        omittable: false
      booleanValue:
        omittable: false
      nullValue:
        omittable: false
  AutomationConfig:
    model: github.com/saffronjam/saffron-hive/internal/automation.AuthoringConfig
  AutomationConfigInput:
    model: github.com/saffronjam/saffron-hive/internal/automation.AuthoringConfig
    fields:
      trigger:
        omittable: false
      condition:
        omittable: false
      operator:
        omittable: false
      action:
        omittable: false
      macro:
        omittable: false
  AutomationTrigger:
