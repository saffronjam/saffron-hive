  previewVibe(input: PreviewVibeInput!): VibePreviewResult! @auth
  automations: [AutomationGraph!]! @auth
  automation(id: ID!): AutomationGraph @auth
  webhookEndpoints: [WebhookEndpoint!]! @auth
  webhookEndpoint(id: ID!): WebhookEndpoint @auth
  webhookDeliveries(endpointId: ID!, before: DateTime, limit: Int): [WebhookDelivery!]! @auth
  groups: [Group!]! @auth
  group(id: ID!): Group @auth
  rooms: [Room!]! @auth
  room(id: ID!): Room @auth
  "The floor plan. Null until the first save."
  floorplan: Floorplan @auth
  stateHistory(filter: StateHistoryFilter!): [StateSeries!]! @auth
  aggregatedStateHistory(filter: AggregatedStateHistoryFilter!): [AggregatedSeries!]! @auth
  stateHistoryFields: [String!]! @auth
  integrations: [Integration!]! @auth
  zigbee2MqttConfig: Zigbee2MqttConfig @auth
  tuyaConfig: TuyaConfig @auth
  """Every provider's stored mesh snapshot. Empty until a scan completes."""
  networkTopologies: [NetworkTopology!]! @auth
