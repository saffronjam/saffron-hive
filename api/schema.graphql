  activeEffects: [ActiveEffect!]! @auth
  nativeEffectOptions: [NativeEffectOption!]! @auth
  nativeEffectSupport(name: String!): [NativeEffectDeviceSupport!]! @auth
}

type Mutation {
  updateLocalizedNameSet(input: LocalizedNameSetInput!): LocalizedNameSet! @auth
  updateDevice(id: ID!, input: UpdateDeviceInput!): Device! @auth
  deleteDevice(id: ID!): Device! @auth
  restoreDevice(id: ID!): Device! @auth
  batchDeleteDevices(ids: [ID!]!): Int! @auth
  batchRestoreDevices(ids: [ID!]!): Int! @auth
  setTargetState(target: CommandTargetInput!, state: DeviceStateInput!): Boolean! @auth
  setDeviceConfiguration(deviceId: ID!, settings: [DeviceConfigurationEntryInput!]!): Boolean! @auth
  """
  Simulate a device-fired action by publishing a synthetic
  EventDeviceActionFired on the in-process event bus. Automations listening
  for the action run as if the physical device emitted it; no command is
  sent to the device itself. Useful for testing automations from the UI.
  """
  simulateDeviceAction(deviceId: ID!, action: String!): Boolean! @auth
  applyScene(sceneId: ID!): Scene! @auth
  deactivateScene(sceneId: ID!): Scene! @auth
  createScene(input: CreateSceneInput!): Scene! @auth
  updateScene(id: ID!, input: UpdateSceneInput!): Scene! @auth
  deleteScene(id: ID!): Boolean! @auth
  createAutomation(input: CreateAutomationInput!): AutomationGraph! @auth
  updateAutomation(id: ID!, input: UpdateAutomationInput!): AutomationGraph! @auth
  deleteAutomation(id: ID!): Boolean! @auth
  toggleAutomation(id: ID!, enabled: Boolean!): AutomationGraph! @auth
  """
  Fires a trigger node immediately inside its enabled automation. The trigger's
  configured event or schedule does not need to occur. Intended for testing a
  saved automation from the live graph.
  """
  fireAutomationTrigger(automationId: ID!, nodeId: ID!): Boolean! @auth
  createWebhookEndpoint(input: CreateWebhookEndpointInput!): WebhookSecretResult! @auth
  updateWebhookEndpoint(id: ID!, input: UpdateWebhookEndpointInput!): WebhookEndpoint! @auth
  rotateWebhookEndpointSecret(id: ID!): WebhookSecretResult! @auth
  deleteWebhookEndpoint(id: ID!): Boolean! @auth
  batchDeleteWebhookEndpoints(ids: [ID!]!): Int! @auth
  createGroup(input: CreateGroupInput!): Group! @auth
  updateGroup(id: ID!, input: UpdateGroupInput!): Group! @auth
  deleteGroup(id: ID!): Boolean! @auth
  """
  Adds a member and returns the whole group, so a caller holding the group
  can apply the result without recomputing `resolvedDevices` itself.
  """
  addGroupMember(input: AddGroupMemberInput!): Group! @auth
  "Removes a member by membership id and returns the group it belonged to."
  removeGroupMember(id: ID!): Group! @auth
  createRoom(input: CreateRoomInput!): Room! @auth
  updateRoom(id: ID!, input: UpdateRoomInput!): Room! @auth
  deleteRoom(id: ID!): Boolean! @auth
  """
  Adds a member and returns the whole room, so a caller holding the room
  can apply the result without recomputing `resolvedDevices` itself.
  """
  addRoomMember(input: AddRoomMemberInput!): Room! @auth
  "Removes a member by membership id and returns the room it belonged to."
  removeRoomMember(id: ID!): Room! @auth
  """
  Upserts the floorplan row and replaces its vertices, walls, rooms, and
  placements with the input's sets in one transaction. Returns the saved plan.
  """
  updateFloorplan(input: UpdateFloorplanInput!): Floorplan! @auth
  updateZigbee2MqttConfig(input: Zigbee2MqttConfigInput!): Zigbee2MqttConfig! @auth
  testZigbee2MqttConnection(input: Zigbee2MqttConfigInput!): ConnectionTestResult! @auth
  """
  Requests a Zigbee topology scan. Returns immediately; the scan walks every
  router on the mesh, takes minutes, and slows the network while it runs.
  Completion is announced on the networkTopologyUpdated subscription.
  """
  scanZigbee2MqttNetwork: Boolean! @auth
  updateTuyaConfig(input: TuyaConfigInput!): TuyaConfig! @auth
  testTuyaConnection(input: TuyaConfigInput!): ConnectionTestResult! @auth
  syncTuyaDevices: [Device!]! @auth
  deleteIntegration(provider: String!): Int! @auth
  updateSetting(key: String!, value: String!): Setting! @auth
  login(input: LoginInput!): AuthPayload!
  createInitialUser(input: CreateInitialUserInput!): AuthPayload!
  createUser(input: CreateUserInput!): User! @auth
  updateCurrentUser(input: UpdateCurrentUserInput!): User! @auth
  changePassword(input: ChangePasswordInput!): Boolean! @auth
  """
  Completes the forced first-login password change. Only callable while the
  caller's `mustChangePassword` flag is set; the AuthDirective allowlists this
  field for users in the forced-change state. Sets the new password hash and
  clears the flag in one statement. Returns false if the caller was not in the
  forced-change state.
  """
  completeFirstPasswordChange(newPassword: String!): Boolean! @auth
  resetUserPassword(id: ID!, newPassword: String!): Boolean! @auth
  """
  Invalidates every JWT issued for the given user by bumping their
  token_version. When userId is null the caller's own tokens are
  invalidated, which logs them out of every device — useful when a session
  may have been compromised. The current request still completes; the
  next API call from any device (including this one) returns
  UNAUTHENTICATED and forces a fresh login.
  """
  forceLogoutAllSessions(userId: ID): Boolean! @auth
  deleteUser(id: ID!): Boolean! @auth
  raiseAlarm(input: RaiseAlarmInput!): Alarm! @auth
  deleteAlarm(alarmId: ID!): Boolean! @auth

  batchDeleteScenes(ids: [ID!]!): Int! @auth
  batchDeleteAutomations(ids: [ID!]!): Int! @auth
  batchDeleteGroups(ids: [ID!]!): Int! @auth
  batchDeleteRooms(ids: [ID!]!): Int! @auth
  batchDeleteEffects(ids: [ID!]!): Int! @auth
  """
  Clears the new-device flag for the given devices and returns how many rows
  changed. The device list calls this with everything it renders.
  """
  markDevicesSeen(ids: [ID!]!): Int! @auth
  batchDeleteAlarms(alarmIds: [ID!]!): Int! @auth
  completeMaintenanceTasks(ids: [ID!]!): [ID!]! @auth
  """
  Deletes the specified users. The currently authenticated user is silently
  skipped if present in the list. Returns the number of users actually deleted.
  """
  batchDeleteUsers(ids: [ID!]!): Int! @auth

  batchAddRoomMembers(roomId: ID!, members: [RoomMemberInput!]!): Room! @auth
  batchAddGroupDevices(groupId: ID!, deviceIds: [ID!]!): Group! @auth

  createEffect(input: CreateEffectInput!): Effect! @auth
  updateEffect(input: UpdateEffectInput!): Effect! @auth
  deleteEffect(id: ID!): Boolean! @auth
  """
  Starts effectId on the given target. Preempts any effect already
  running on the target. Returns the resulting active-run row.
  """
  runEffect(effectId: ID!, targetType: String!, targetId: ID!): ActiveEffect! @auth
  """
  Requests a native effect and waits briefly for each target device to report
  whether it started. Devices without a verifiable readback return UNCONFIRMED.
  """
  runNativeEffect(nativeName: String!, targetType: String!, targetId: ID!): NativeEffectRunResult! @auth
  """
  Stops any effect currently running on the target. Returns true when a
  run was active, false otherwise.
  """
  stopEffect(targetType: String!, targetId: ID!): Boolean! @auth
}

type Subscription {
  deviceStateChanged(deviceId: ID): DeviceStateEvent! @auth
  deviceConfigurationChanged(deviceId: ID): DeviceConfigurationEvent! @auth
  deviceActionFired(deviceId: ID): DeviceActionEvent! @auth
  deviceAvailabilityChanged: DeviceAvailabilityEvent! @auth
  deviceAdded: Device! @auth
  """
  Fires when a device's user-owned metadata changes — name override, icon,
  roles, display colour, disabled, deleted — carrying the full updated device. This is
  what keeps a second open tab's rename in step without a reload.
  """
  deviceUpdated: Device! @auth
  deviceRemoved: ID! @auth
  groupsChanged: [ID!]! @auth
  automationNodeActivated(automationId: ID): AutomationNodeActivationEvent! @auth
  sceneActiveChanged: SceneActiveEvent! @auth
  logStream: LogEntry! @auth
  activityStream(advanced: Boolean): ActivityEvent! @auth
  alarmEvent: AlarmEvent! @auth
  maintenanceChanged: DateTime! @auth
  webhookDeliveryRecorded(endpointId: ID): WebhookDelivery! @auth
  """
  Step-boundary events from the effect runner. When runId is provided,
  only events for that run are delivered; otherwise every effect run's
  step boundaries are broadcast.
  """
  effectStepActivated(runId: ID): EffectStepEvent! @auth
  nativeEffectSupportChanged: DateTime! @auth
  """
  Fires after a merged topology snapshot is persisted, so a consumer that
  re-queries on it always reads the new snapshot. When provider is given,
  only that provider's updates are delivered.
  """
  networkTopologyUpdated(provider: String): NetworkTopologyEvent! @auth
}
